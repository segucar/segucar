services:
  - type: web
    name: segucar
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
    disk:
      name: segucar-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
