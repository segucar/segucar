<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — SEGUCar Gestión Interna</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-main), 0 0 35px rgba(0, 91, 150, 0.2);
      padding: 36px 30px;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--segucar-blue), var(--accent-cyan));
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
      display: inline-block;
    }
    .login-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .login-title span {
      color: var(--accent-cyan);
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .login-input {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-btn);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 14px;
      transition: var(--transition);
      outline: none;
    }
    .login-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
    }
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -4px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }
    .checkbox-label input {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .btn-login {
      background: linear-gradient(135deg, var(--segucar-blue), var(--segucar-blue-light));
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: var(--radius-btn);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px 20px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, var(--segucar-blue-light), var(--accent-cyan));
      box-shadow: var(--shadow-glow);
      transform: translateY(-1px);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-error {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.4);
      color: #ff6b81;
      border-radius: var(--radius-btn);
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-icon">🛡️</div>
        <h1 class="login-title">SEGU<span>Car</span></h1>
        <p class="login-subtitle">Gestión Interna de Pólizas & Clientes</p>
      </div>

      <div id="loginError" class="login-error"></div>

      <form id="loginForm" class="login-form">
        <div class="form-field">
          <label for="usernameInput">Usuario</label>
          <input 
            type="text" 
            id="usernameInput" 
            class="login-input" 
            placeholder="Usuario de oficina" 
            autocomplete="username"
            autofocus
            required 
          />
        </div>

        <div class="form-field">
          <label for="passwordInput">Contraseña</label>
          <input 
            type="password" 
            id="passwordInput" 
            class="login-input" 
            placeholder="••••••••" 
            autocomplete="current-password"
            required 
          />
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberInput" checked />
            <span>Recordar en este equipo (30 días)</span>
          </label>
        </div>

        <button type="submit" id="btnLogin" class="btn-login">
          <span>Ingresar al Panel</span>
          <span>→</span>
        </button>
      </form>

      <div class="login-footer-note">
        Acceso restringido únicamente para personal autorizado de Segucar.
      </div>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('btnLogin');
      const errorBox = document.getElementById('loginError');
      const userInput = document.getElementById('usernameInput');
      const passInput = document.getElementById('passwordInput');
      const rememberInput = document.getElementById('rememberInput');

      // Si ya hay sesión activa, redirigir automáticamente al dashboard
      fetch('/api/auth/check')
        .then(r => r.json())
        .then(data => {
          if (data && data.authenticated) {
            window.location.replace('/index.html');
          }
        })
        .catch(() => {});

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorBox.style.display = 'none';

        const username = (userInput.value || '').trim();
        const password = (passInput.value || '').trim();
        const remember = rememberInput.checked;

        if (!username || !password) {
          showError('Por favor completá usuario y contraseña.');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span>Verificando...</span>';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, remember })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            btn.innerHTML = '<span>¡Acceso correcto! Entrando...</span>';
            // Redirigir al inicio o página previa
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect') || '/index.html';
            setTimeout(() => {
              window.location.replace(redirectUrl);
            }, 300);
          } else {
            showError(data.message || 'Usuario o contraseña incorrectos.');
            btn.disabled = false;
            btn.innerHTML = '<span>Ingresar al Panel</span><span>→</span>';
            passInput.value = '';
            passInput.focus();
          }
        } catch (err) {
          showError('Error de conexión al verificar credenciales.');
          btn.disabled = false;
          btn.innerHTML = '<span>Ingresar al Panel</span><span>→</span>';
        }
      });

      function showError(msg) {
        errorBox.textContent = '❌ ' + msg;
        errorBox.style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
